    </section>
    <script>
        document.getElementById("searchForm").addEventListener("submit", function (e) {
            e.preventDefault();
            const tokenInput = this.token.value;
            const tokenValue = tokenInput.trim();

            if (!tokenValue) {
                document.getElementById("staticBackdropLabel").textContent = "PERHATIAN!!!";
                const modalBody = document.querySelector('#staticBackdrop .modal-body');
                modalBody.innerHTML = `
      <p><strong>HARAP MASUKKAN TOKEN YANG INGIN DI CEK</strong></p>
    `;
                const modal = new bootstrap.Modal(document.getElementById('staticBackdrop'));
                modal.show();
                return;
            }

            // Panggil endpoint pencarian token
            fetch(`/search?token=${encodeURIComponent(tokenValue)}`)
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(data => {
                            throw new Error(data.error || "Token tidak ditemukan.");
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    const modalBody = document.querySelector('#staticBackdrop .modal-body');
                    if (modalBody) {
                        document.getElementById("staticBackdropLabel").textContent = "Hasil Pencarian";
                        modalBody.innerHTML = `
          <p><strong>Hasil Pencarian Untuk Token:</strong> ${data.query}</p>
          <div class="container text-center">
            <table class="table">
              <thead>
                <tr>
                  <th scope="col">TOKEN</th>
                  <th scope="col">Status</th>
                  <th scope="col">EXP</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>${data.token}</td>
                  <td>${data.status}</td>
                  <td>${data.remainingTime}</td>
                </tr>
              </tbody>
            </table>
            <p>${data.message}</p>
          </div>
        `;
                    } else {
                        console.error("Modal body tidak ditemukan.");
                    }
                    const modal = new bootstrap.Modal(document.getElementById('staticBackdrop'));
                    modal.show();
                })
                .catch(error => {
                    const modalBody = document.querySelector('#staticBackdrop .modal-body');
                    if (modalBody) {
                        modalBody.innerHTML = `<p><strong>${error.message}</strong></p>`;
                    }
                    const modal = new bootstrap.Modal(document.getElementById('staticBackdrop'));
                    modal.show();
                });
        });
    </script>
